<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <g opacity="0.7" stroke="#e10600" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" fill="none">
